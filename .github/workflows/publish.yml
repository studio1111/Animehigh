name: Animehigh publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: animehigh-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run publisher
        env:
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
          ANIMEHIGH_DRY_RUN: ${{ vars.ANIMEHIGH_DRY_RUN }}
        run: python app.py
